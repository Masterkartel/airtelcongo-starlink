<style>
:root{
  --red:#E40000;--red-dk:#B20000;--red-lt:#FFE5E5;--red-soft:#FFF5F5;
  --ink:#0A0A0E;--ink-2:#484852;--ink-3:#6B6B75;--ink-4:#8A8A94;
  --line:#EAEAEF;--surf:#FFFFFF;--surf-lo:#FAFAFC;--surf-mid:#F0F0F5;
  --ok:#16A34A;--ok-soft:#DCFCE7;
  --ease:cubic-bezier(.2,0,0,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-display:'Space Grotesk','Inter',sans-serif;
  --font-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0A0A0E;height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body);font-size:clamp(14px,3.8vw,16px);line-height:1.55;
  color:var(--ink);background:var(--surf-lo);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  display:flex;flex-direction:column;position:fixed;inset:0;
  width:100%;height:100vh;height:100dvh;overflow:hidden;
  -webkit-user-select:none;user-select:none;text-rendering:optimizeLegibility;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;outline:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;min-height:44px;min-width:44px}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}

@keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.4);opacity:0}}
@keyframes rip-anim{to{transform:scale(3.2);opacity:0}}
@keyframes logoPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.88)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(calc(100dvh + 20px)) rotate(720deg);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* NAV */
.nav{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(135deg,#C80000 0%,#E40000 55%,#D40000 100%);
  height:calc(48px + var(--safe-t));
  padding:var(--safe-t) 16px 0;
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 4px 20px rgba(180,0,0,.24);
  z-index:20;position:relative;
}
.nav::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 100% at 100% 0%,rgba(255,255,255,.18) 0%,transparent 50%);pointer-events:none}
.nav-brand{display:flex;align-items:center;gap:10px;min-width:0;position:relative;z-index:1}
.nav-logo{height:22px;width:auto;color:#fff;flex-shrink:0}
.nav-pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);border-radius:999px;flex-shrink:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:relative;z-index:1}
.nav-dot{width:5px;height:5px;border-radius:50%;background:#4ADE80;animation:dot-pulse 2s infinite;flex-shrink:0;box-shadow:0 0 0 3px rgba(74,222,128,.22)}
.nav-pill-txt{font-size:10px;font-weight:700;color:#fff;letter-spacing:.02em;white-space:nowrap}

.t-overlay{position:fixed;inset:0;z-index:9000;opacity:0;pointer-events:none;transition:opacity .2s ease;display:grid;place-items:center;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.t-overlay.show{opacity:1;pointer-events:all}
.t-spinner{width:56px;height:56px;border-radius:50%;border:3px solid var(--red-lt);border-top-color:var(--red);border-right-color:var(--red);animation:spin 1.2s cubic-bezier(.4,0,.2,1) infinite;display:grid;place-items:center;position:relative}
.t-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:9001;overflow:hidden;pointer-events:none}
.t-bar-fill{height:100%;width:0;background:var(--red);border-radius:0 2px 2px 0;box-shadow:0 0 10px rgba(228,0,0,.6);transition:width .4s var(--ease)}

/* MAIN — single screen, no scroll */
.main{
  flex:1;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(12px,3vw,18px);
  padding:clamp(12px,3vw,20px) 16px max(12px,var(--safe-b));
  animation:pg-in .4s var(--ease) both;
  max-width:400px;margin-inline:auto;width:100%;
  position:relative;overflow:hidden;
}
.main::before{
  content:'';position:absolute;top:-30%;left:50%;transform:translateX(-50%);
  width:200%;height:60%;
  background:radial-gradient(circle,rgba(22,163,74,.04) 0%,transparent 60%);
  pointer-events:none;
}
.confetti-wrap{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti-piece{
  position:absolute;top:-20px;
  width:8px;height:8px;border-radius:2px;
  animation:confetti 2.5s ease-in forwards;
}

/* SUCCESS */
.success{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;z-index:1}
.success-sub{font-size:clamp(11px,3vw,13px);color:var(--ink-3);line-height:1.4}
.success-ring{
  width:clamp(56px,14vw,72px);height:clamp(56px,14vw,72px);border-radius:50%;
  background:linear-gradient(135deg,var(--ok-soft) 0%,#BBF7D0 100%);
  display:grid;place-items:center;
  animation:pop .55s var(--spring) both;
  box-shadow:0 6px 20px rgba(22,163,74,.2);
}
.success-ring svg{width:60%;height:60%}
.success-ring path{stroke:var(--ok);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:48;stroke-dashoffset:48;animation:draw .65s .35s cubic-bezier(.2,0,.2,1) forwards}
.success h1{font-family:var(--font-display);font-size:clamp(20px,5vw,24px);font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1.15}

.status-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(228,0,0,.06);border:1px solid rgba(228,0,0,.18);border-radius:999px}
.ping-wrap{position:relative;width:8px;height:8px;flex-shrink:0}
.ping-ring{position:absolute;inset:0;border-radius:50%;background:var(--red);animation:ping 1.6s infinite}
.ping-core{position:absolute;inset:1px;border-radius:50%;background:var(--red)}
.status-txt{font-size:9px;font-weight:800;color:var(--red);letter-spacing:.08em;text-transform:uppercase;line-height:1}

/* REF */
.ref-card{
  width:100%;
  padding:clamp(12px,3vw,16px);
  background:linear-gradient(135deg,#fff 0%,#FFF5F5 100%);
  border:1px solid rgba(228,0,0,.14);
  border-radius:18px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 2px 8px rgba(10,10,14,.04);
}
.ref-left{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.ref-lbl{font-size:9px;font-weight:800;color:var(--ink-4);letter-spacing:.1em;text-transform:uppercase;line-height:1}
.ref-val{font-family:var(--font-mono);font-size:clamp(15px,4vw,18px);font-weight:600;color:var(--red);letter-spacing:.03em;line-height:1.2;word-break:break-all}
.copy-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:8px 14px;background:var(--surf-mid);border:1px solid var(--line);border-radius:999px;
  font-size:11px;font-weight:600;color:var(--ink-2);line-height:1;
  transition:background .15s;white-space:nowrap;
}
.copy-btn:active{background:#E5E5EA}
.copy-btn svg{width:12px;height:12px;flex-shrink:0}

/* ORDER SUMMARY — compact inline */
.order{
  width:100%;
  background:var(--surf);border:1px solid var(--line);border-radius:18px;
  padding:clamp(10px,2.5vw,14px) clamp(12px,3vw,16px);
  display:flex;flex-direction:column;gap:clamp(6px,1.5vw,10px);
  box-shadow:0 2px 8px rgba(10,10,14,.04);
}
.order-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.order-name{font-family:var(--font-display);font-size:clamp(14px,3.6vw,17px);font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.order-price{font-family:var(--font-display);font-size:clamp(16px,4.2vw,20px);font-weight:700;letter-spacing:-.02em;color:var(--red);line-height:1}
.order-meta{display:flex;align-items:center;gap:clamp(8px,2vw,12px);flex-wrap:wrap;font-size:clamp(10px,2.7vw,12px);color:var(--ink-3)}
.order-meta-item{display:inline-flex;align-items:center;gap:4px;line-height:1}
.order-meta-item svg{width:11px;height:11px;flex-shrink:0;opacity:.5}
.order-dot{width:3px;height:3px;border-radius:50%;background:var(--line);flex-shrink:0}

/* ACTIONS */
.actions{
  width:100%;display:flex;flex-direction:column;gap:clamp(8px,2vw,10px);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:clamp(44px,11vw,52px);padding-inline:20px;border-radius:999px;
  font-family:var(--font-display);font-size:clamp(13px,3.5vw,15px);font-weight:700;
  letter-spacing:.005em;
  transition:transform .15s var(--spring);
  white-space:nowrap;border:none;position:relative;overflow:hidden;min-height:44px;
}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn:active{transform:scale(.97)}
.btn-p{
  background:linear-gradient(135deg,#FF2E2E 0%,#E40000 50%,#B20000 100%);color:#fff;
  box-shadow:0 6px 22px rgba(228,0,0,.4),0 1px 0 rgba(255,255,255,.2) inset;
}
.btn-p::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.15) 0%,transparent 60%);pointer-events:none}
.btn-p > *{position:relative;z-index:1}
.btn-g{background:var(--surf);color:var(--ink-2);border:1.5px solid var(--line);font-family:var(--font-body);font-weight:600}
.btn-g:active{background:var(--surf-lo)}

.footer-inline{text-align:center;font-size:clamp(9px,2.4vw,10.5px);color:var(--ink-4);line-height:1.4}

.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(0,0,0,.08);transform:scale(0);animation:rip-anim .55s ease forwards}

html,*{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important}

@media(max-height:640px){
  .nav{height:calc(42px + var(--safe-t))}
  .main{gap:8px!important;padding:8px 12px max(8px,var(--safe-b))!important}
  .success-ring{width:48px!important;height:48px!important}
  .success h1{font-size:18px!important}
  .btn{height:40px!important}
}
@media(max-width:360px){
  .main{padding:10px 10px max(8px,var(--safe-b))}
}
@media(min-width:430px){
  .main{padding:20px 20px max(14px,var(--safe-b))}
}
</style>
</head>

<script>
'use strict';

function hap(p){ try { if(navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function rip(el,e){
  if(!el||!e)return;
  var r=el.getBoundingClientRect(),sz=Math.max(r.width,r.height)*2.5;
  var s=document.createElement('span');s.className='rip';
  s.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-r.left-sz/2)+'px;top:'+(e.clientY-r.top-sz/2)+'px;';
  el.appendChild(s);s.addEventListener('animationend',function(){s.remove();});
}
function navigate(url){
  var overlay=document.getElementById('tOverlay');
  var fill=document.getElementById('tBarFill');
  if(!overlay||!fill){location.href=url;return;}
  fill.style.width='0%';fill.style.transition='none';
  overlay.classList.add('show');
  requestAnimationFrame(function(){
    fill.style.transition='width .5s cubic-bezier(.1,0,.3,1)';
    fill.style.width='80%';
  });
  setTimeout(function(){
    fill.style.transition='width .2s ease';
    fill.style.width='100%';
    setTimeout(function(){location.href=url;},200);
  },500);
}
function newOrder(){ hap([10,6,18]); navigate('airtel-index.html'); }

function read(k, fb){
  try { return JSON.parse(sessionStorage.getItem(k) || fb); } catch(e){ return JSON.parse(fb); }
}

var forfait = read('starlinkForfait', '{}');
var auth = read('starlinkAuth', '{}');
var ref = sessionStorage.getItem('starlinkRef') || ('STL-CG-' + (Math.random()*9e5+1e5|0));

var phone = (auth.phone || forfait.phone || '').replace(/\D/g, '');
var phoneFmt = phone.length === 9
  ? '+243 ' + phone.slice(0,2) + ' ' + phone.slice(2,5) + ' ' + phone.slice(5)
  : '—';

function setText(id, v){ var el = document.getElementById(id); if(el) el.textContent = v; }

setText('refVal', '#' + ref);
setText('pName', forfait.name || 'Forfait');
setText('pPrice', forfait.price || '—');
setText('rPhone', phoneFmt);
setText('rDays', forfait.jours ? forfait.jours + (forfait.jours === 1 ? ' jour' : ' jours') : '—');

/* Meta Pixel — Purchase */
(function(){
  var value = 0;
  try { value = parseFloat(String(forfait.price||'0').replace('$','')) || 0; } catch(e){}
  try {
    if (window.fbq) window.fbq('track', 'Purchase', {
      value: value, currency: 'USD',
      content_name: forfait.name || 'Forfait satellite',
      content_type: 'product', num_items: 1
    });
  } catch(e){}
})();

function copyRef(){
  var txt = document.getElementById('refVal').textContent;
  if(navigator.clipboard) navigator.clipboard.writeText(txt);
  hap([8,4,12]);
  var el = document.getElementById('copyTxt');
  el.textContent = '✓';
  setTimeout(function(){ el.textContent = 'Copier'; }, 2000);
}
function shareRef(){
  hap([8,4,12]);
  var txt = 'Airtel RDC — Réf. ' + ref + '\n' + (forfait.name||'—') + ' · ' + (forfait.price||'—') + '\nTél: ' + phoneFmt;
  if(navigator.share){ navigator.share({title:'Airtel RDC',text:txt}).catch(function(){}); return; }
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(function(){
      var b = document.getElementById('shareBtn');
      var o = b.innerHTML; b.innerHTML = '✓ Copié';
      setTimeout(function(){ b.innerHTML = o; }, 1800);
    }).catch(function(){});
  }
}

document.querySelectorAll('button').forEach(function(b){
  b.addEventListener('pointerdown', function(e){ rip(this, e); }, {passive:true});
});

/* Confetti burst */
(function(){
  var wrap = document.getElementById('confettiWrap');
  if(!wrap) return;
  var colors = ['#E40000','#FF6B6B','#FFD700','#4ADE80','#60A5FA','#F472B6','#A78BFA'];
  for(var i=0;i<28;i++){
    var el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random()*100 + '%';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.width = (5+Math.random()*6) + 'px';
    el.style.height = (5+Math.random()*6) + 'px';
    el.style.animationDelay = (Math.random()*1.2) + 's';
    el.style.animationDuration = (1.8+Math.random()*1.5) + 's';
    el.style.borderRadius = Math.random()>.5 ? '50%' : '2px';
    wrap.appendChild(el);
  }
  setTimeout(function(){ wrap.remove(); }, 4500);
})();
</script>
