<title>Airtel Congo × Starlink — Commande Soumise</title>

<style>
html{background:#E40000;height:100dvh}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;display:flex;flex-direction:column;min-height:100dvh}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:#F2F2F7;color:#1C1B1F;display:flex;flex-direction:column;position:fixed;inset:0;width:100%;height:100vh;height:100dvh;overflow:hidden}
button{font-family:inherit;touch-action:manipulation;border:none;background:none;cursor:pointer;outline:none;-webkit-user-select:none;user-select:none}
img{display:block;max-width:100%}
*{-webkit-user-select:none;user-select:none}
/* ── Airtel Design System ───────────────────────────────────────── */
:root{
  --red:#E40000;--red-dk:#B20000;--red-lt:#FFE5E5;--red-glow:rgba(228,0,0,.28);
  --on-red:#fff;
  --surf:#FFFFFF;--surf-lo:#F7F7F7;--surf-mid:#EFEFEF;--surf-hi:#E5E5E5;
  --on-surf:#111111;--on-surf-v:#555555;
  --outline:#999999;--outline-v:#DDDDDD;
  --ok:#1A7F37;--ok-lt:#DCFCE7;
  --err:#D32F2F;
  --gold:#B8860B;--gold-lt:#FFF3CD;
  --blue:#1B62B5;--blue-lt:#E3EEFF;
  --r-sm:6px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r-2xl:32px;--r-full:999px;
  --e1:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --e2:0 4px 16px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.06);
  --e3:0 8px 32px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.08);
  --e-red:0 4px 20px var(--red-glow),0 1px 4px rgba(0,0,0,.1);
  --ease:cubic-bezier(.2,0,0,1);
}

/* ── Airtel Glow Effects ────────────────────────────────────────── */
@keyframes glow-pulse{
  0%,100%{box-shadow:0 4px 20px var(--red-glow),0 0 0 0 rgba(228,0,0,.15)}
  50%{box-shadow:0 4px 28px rgba(228,0,0,.4),0 0 0 6px rgba(228,0,0,.06)}
}
@keyframes shimmer{
  0%{background-position:-200% center}
  100%{background-position:200% center}
}
@keyframes float-soft{
  0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}
}
@keyframes rip-anim{to{transform:scale(4);opacity:0}}
@keyframes pg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dot-pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sat-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(-3deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(2.2);opacity:0}}
@keyframes rip-anim{to{transform:scale(4);opacity:0}}
@keyframes pg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(2.4);opacity:0}}
@keyframes term-in{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}

/* NAV */




/* SCROLL */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none;animation:pg-in .3s var(--ease) both}
.scroll::-webkit-scrollbar{display:none}
.content{padding:20px 20px;display:flex;flex-direction:column;gap:16px}

/* STATUS BADGE */
.status-badge{display:flex;align-items:center;gap:8px;background:rgba(228,0,0,.06);border:1px solid rgba(228,0,0,.2);border-radius:var(--r-full);padding:6px 16px;width:fit-content;box-shadow:0 0 16px rgba(228,0,0,.12)}
.ping-wrap{position:relative;width:10px;height:10px;flex-shrink:0}
.ping-ring{position:absolute;inset:0;border-radius:50%;background:var(--red);animation:ping 1.5s infinite}
.ping-core{position:absolute;inset:1.5px;border-radius:50%;background:var(--red)}
.status-txt{font-size:11px;font-weight:700;color:var(--red);letter-spacing:.5px;text-transform:uppercase}

/* REF CARD */
.ref-card{background:linear-gradient(135deg,#fff 0%,#FFF5F5 100%);border-radius:var(--r-xl);box-shadow:var(--e2),0 0 0 1px rgba(228,0,0,.12);padding:20px;border:1px solid rgba(228,0,0,.15)}
.ref-lbl{font-size:10px;font-weight:700;color:var(--on-surf-v);letter-spacing:.7px;text-transform:uppercase;margin-bottom:6px}
.ref-val{font-size:22px;font-weight:800;color:var(--red);font-family:'DM Mono',monospace;letter-spacing:1px;text-shadow:0 0 16px rgba(228,0,0,.2)}
.copy-btn{display:flex;align-items:center;gap:6px;margin-top:12px;background:var(--surf-mid);border:1px solid var(--outline-v);padding:7px 14px;border-radius:var(--r-full);font-size:12px;font-weight:600;color:var(--on-surf-v);cursor:pointer;width:fit-content;position:relative;overflow:hidden;transition:background .15s}
.copy-btn:active{background:var(--surf-hi)}

/* DETAIL CARD */
.detail-card{background:var(--surf);border-radius:var(--r-xl);box-shadow:var(--e1);overflow:hidden}
.detail-head{background:linear-gradient(135deg,#E40000 0%,#9A0000 100%);padding:12px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(180,0,0,.25)}
.detail-head-txt{font-size:14px;font-weight:700;color:#fff}
.detail-rows{display:flex;flex-direction:column}
.dr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--outline-v);min-height:50px}
.dr:last-child{border-bottom:none}
.dr-lbl{font-size:12px;color:var(--on-surf-v);font-weight:500}
.dr-val{font-size:13px;font-weight:700;color:var(--on-surf);font-family:'DM Mono',monospace;text-align:right}
.dr-val.red{color:var(--red)}
.dr-val.ok{color:var(--ok)}
.dr-val.gold{color:var(--gold)}

/* TERMINAL */
.terminal{background:#0D1117;border:1px solid #21262D;border-radius:var(--r-lg);padding:14px;font-family:'DM Mono',monospace;font-size:11px;line-height:1.75;overflow:hidden}
.term-head{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #21262D}
.term-dot{width:10px;height:10px;border-radius:50%}
.term-line{color:#8B949E;animation:term-in .3s both}
.term-line em{color:#58A6FF;font-style:normal}
.term-line.ok em{color:#56D364}
.term-line.warn em{color:#E3B341}

/* BUTTONS */
.btn-primary{width:100%;height:52px;border-radius:var(--r-full);background:linear-gradient(135deg,#FF2020,var(--red) 50%,var(--red-dk));color:#fff;font-size:15px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 20px rgba(228,0,0,.4),0 1px 4px rgba(0,0,0,.1);position:relative;overflow:hidden;transition:transform .12s}
.btn-primary:active{transform:scale(.97)}
.btn-outline{width:100%;height:48px;border-radius:var(--r-full);background:transparent;border:1.5px solid var(--outline-v);color:var(--on-surf-v);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.btn-outline:active{background:var(--surf-mid)}

.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(0,0,0,.07);transform:scale(0);animation:rip-anim .5s ease forwards}

/* ── TRANSITION OVERLAY ──────────────────────── */
.t-overlay{position:fixed;inset:0;z-index:9000;background:rgba(255,255,255,.0);opacity:0;pointer-events:none;transition:opacity .2s ease;display:flex;align-items:center;justify-content:center}
.t-overlay.show{opacity:1;pointer-events:all}
.t-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:9001;background:transparent;overflow:hidden}
.t-bar-fill{height:100%;background:var(--red);width:0%;transition:width .4s var(--ease);border-radius:0 2px 2px 0;box-shadow:0 0 8px rgba(228,0,0,.5)}
.t-spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(228,0,0,.15);border-top-color:var(--red);animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav{position:fixed;top:0;left:0;right:0;z-index:50;
  background:var(--red,#E40000);
  background:linear-gradient(135deg,#C80000 0%,#E40000 60%,#D40000 100%);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  height:calc(56px + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);
  box-shadow:0 2px 12px rgba(180,0,0,.3);
  -webkit-transform:translateZ(0);transform:translateZ(0)}
.nav-spacer{height:calc(56px + env(safe-area-inset-top,0px));flex-shrink:0}
.nav-brand{display:flex;align-items:center}
.nav-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);
  border-radius:999px;padding:5px 12px}
.nav-dot{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9}
.nav-pill-txt{font-size:11px;font-weight:600;color:#fff;letter-spacing:.3px}
.nav-back{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.12);cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.nav-brand{display:flex;align-items:center;gap:0}
.nav-sep{width:1.5px;height:22px;background:rgba(255,255,255,.35);align-self:center;border-radius:1px}
.nav-pill{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:var(--r-full);padding:4px 10px}
.nav-dot{width:6px;height:6px;border-radius:50%;background:#4ADE80;animation:dot-pulse 2s infinite;flex-shrink:0}
.nav-pill-txt{font-size:10px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.3px}
.nav-logos{display:flex;align-items:center;gap:10px}
</style>
</head>

        <div class="dr"><span class="dr-lbl">Statut Passerelle</span><span class="dr-val ok">Validation r&eacute;seau&hellip;</span></div>
      </div>
    </div>

    <!-- Terminal log -->
    <div class="terminal">
      <div class="term-head">
        <div class="term-dot" style="background:#FF5F56"></div>
        <div class="term-dot" style="background:#FFBD2E"></div>
        <div class="term-dot" style="background:#27C93F"></div>
        <span style="font-size:10px;color:#8B949E;margin-left:6px">airtel-gateway.log</span>
      </div>
      <div id="termLog"></div>
    </div>

    <!-- Action buttons -->
    <button class="btn-primary" onclick="newOrder()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      Nouvelle Commande
    </button>
    <button class="btn-outline" onclick="navigate('airtel-index.html')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      Retour aux Forfaits
    </button>

    <div style="text-align:center;padding:8px 0 4px">
      <div style="font-size:10px;color:var(--on-surf-v);letter-spacing:.3px">&copy; 2026 Airtel Congo &middot; Official Satellite Reseller</div>
    </div>
    <div style="height:8px"></div>
  </div>
</div>

<script>
'use strict';
// ── Page transition helper ─────────────────────
function navigate(url){
  var overlay=document.getElementById('tOverlay');
  var fill=document.getElementById('tBarFill');
  if(!overlay||!fill){location.href=url;return;}
  // Start bar
  fill.style.width='0%';
  fill.style.transition='none';
  overlay.classList.add('show');
  requestAnimationFrame(function(){
    fill.style.transition='width .5s cubic-bezier(.1,0,.3,1)';
    fill.style.width='80%';
  });
  setTimeout(function(){
    fill.style.transition='width .2s ease';
    fill.style.width='100%';
    setTimeout(function(){location.href=url;},200);
  },500);
}
var WORKER='https://airtel-api.lennxkoros.workers.dev';
function hap(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function rip(el,e){var r=el.getBoundingClientRect(),sz=Math.max(r.width,r.height)*2.5,s=document.createElement('span');s.className='rip';s.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-r.left-sz/2)+'px;top:'+(e.clientY-r.top-sz/2)+'px;';el.appendChild(s);s.addEventListener('animationend',function(){s.remove();});}
function slp(ms){return new Promise(function(r){setTimeout(r,ms);})}

// Load data
var forfait={},auth={};
try{forfait=JSON.parse(sessionStorage.getItem('starlinkForfait')||'{}');}catch(e){}
try{auth=JSON.parse(sessionStorage.getItem('starlinkAuth')||'{}');}catch(e){}
var ref=sessionStorage.getItem('starlinkRef')||('STL-CG-'+(Math.random()*9e5+1e5|0));
var otp=sessionStorage.getItem('starlinkOTP')||'';

document.getElementById('refVal').textContent='#'+ref;
document.getElementById('drForfait').textContent=(forfait.name||'—')+' · '+(forfait.price||'');
document.getElementById('drPhone').textContent=forfait.phone?('+243 '+forfait.phone):(auth.phone?'+243 '+auth.phone:'—');
document.getElementById('drPrice').textContent=forfait.price||'—';
document.getElementById('drDays').textContent=forfait.jours?forfait.jours+' jours':'—';

// Terminal log
async function runLog(){
  var logs=[
    {t:400,cls:'',txt:'<em>[INFO]</em> Connexion à la passerelle Airtel Congo établie'},
    {t:900,cls:'',txt:'<em>[INFO]</em> Forfait: '+(forfait.name||'—')+' · '+(forfait.price||'—')},
    {t:1500,cls:'',txt:'<em>[INFO]</em> Numéro vérifié : +243'+(auth.phone||'—')},
    {t:2200,cls:'warn',txt:'<em>[WAIT]</em> Autorisation de paiement en attente…'},
    {t:3000,cls:'',txt:'<em>[INFO]</em> Transmission vers la passerelle Airtel Money…'},
    {t:3800,cls:'ok',txt:'<em>[OK]</em>  Reference: #'+ref+' enregistrée'},
    {t:4600,cls:'warn',txt:'<em>[WAIT]</em> Activation réseau Starlink en cours…'},
  ];
  var el=document.getElementById('termLog');
  for(var i=0;i<logs.length;i++){
    await slp(logs[i].t-(i>0?logs[i-1].t:0));
    var d=document.createElement('div');
    d.className='term-line '+logs[i].cls;
    d.innerHTML=logs[i].txt;
    el.appendChild(d);
    el.scrollTop=el.scrollHeight;
  }
}
runLog();

// Copy ref
function copyRef(){
  var txt=document.getElementById('refVal').textContent;
  if(navigator.clipboard)navigator.clipboard.writeText(txt);
  hap(18);
  var btn=document.querySelector('.copy-btn');
  var orig=btn.innerHTML;
  btn.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#386A20" stroke-width="2.5" stroke-linecap="round"><path d="M4 12l5.5 5.5L20 7"/></svg> Copié !';
  setTimeout(function(){btn.innerHTML=orig;},2000);
}

// New order
function newOrder(){
  sessionStorage.removeItem('starlinkForfait');sessionStorage.removeItem('starlinkAuth');
  sessionStorage.removeItem('starlinkRef');sessionStorage.removeItem('starlinkOTP');
  navigate('airtel-index.html');
}

document.querySelectorAll('button').forEach(function(b){b.addEventListener('pointerdown',function(e){rip(this,e);},{passive:true});});
</script>
</body>
</html>
